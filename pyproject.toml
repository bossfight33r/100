[project]
name = "clipfactory"
version = "0.1.0"
description = "Long videos -> vertical short-form clips -> review -> publishing -> stats -> earnings"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "structlog>=24.1",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "redis>=5.0",
    "rq>=1.16",
    "aiogram>=3.10",
    "anthropic>=0.40",
    "faster-whisper>=1.0",
    "mediapipe>=0.10.14",
    "yt-dlp>=2024.8.6",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5", "pytest-asyncio>=0.23", "fakeredis>=2.23", "boto3>=1.34", "moto[s3]>=5.0"]
s3 = ["boto3>=1.34"]
mac = ["mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
cf = "clipfactory.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipfactory"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S603", "S602", "S604"]
ignore = ["B008", "E501"]  # длину кода держит ruff format; длинные SQL/строки допустимы

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = ["slow: uses real ffmpeg rendering"]
